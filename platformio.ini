[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    schreibfaul1/ESP32-audioI2S@^3.0.12
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=16